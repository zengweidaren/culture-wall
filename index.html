<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能财务研发部 - 文化墙</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="particles"></canvas>
    
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="dept-name">智能财务研发部</span>
                <span class="year-month" id="currentYearMonth"></span>
            </h1>
            <p class="subtitle">文化墙 · 记录每一个精彩瞬间</p>
        </header>

        <div class="view-toggle">
            <button class="btn btn-monthly active" id="btnMonthly">
                <span class="icon">📅</span>
                <span>按月份查看</span>
            </button>
            <button class="btn btn-overview" id="btnOverview">
                <span class="icon">📊</span>
                <span>全部月份</span>
            </button>
        </div>

        <section class="section-month-selector" id="monthSelector">
            <div class="month-grid">
                <button class="month-btn" data-month="1">1月</button>
                <button class="month-btn" data-month="2">2月</button>
                <button class="month-btn active" data-month="3">3月</button>
                <button class="month-btn" data-month="4">4月</button>
                <button class="month-btn" data-month="5">5月</button>
                <button class="month-btn" data-month="6">6月</button>
                <button class="month-btn" data-month="7">7月</button>
                <button class="month-btn" data-month="8">8月</button>
                <button class="month-btn" data-month="9">9月</button>
                <button class="month-btn" data-month="10">10月</button>
                <button class="month-btn" data-month="11">11月</button>
                <button class="month-btn" data-month="12">12月</button>
            </div>
        </section>

        <section class="section-gallery" id="sectionGallery">
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="empty-state" id="emptyState">
                <span class="icon">📷</span>
                <span>暂无图片</span>
                <span class="hint">上传图片后将显示在这里</span>
            </div>
        </section>

        <section class="section-all-months" id="sectionAllMonths" style="display: none;">
            <div class="all-months-header">
                <h2 class="section-title">
                    <span class="icon">📋</span>
                    <span>全部月份图片一览</span>
                </h2>
            </div>
            <div id="allMonthsContent"></div>
        </section>
    </div>

    <div class="modal" id="modalPreview">
        <div class="modal-content modal-preview">
            <button class="btn-close" id="btnClosePreview">&times;</button>
            <img id="previewImage" src="" alt="预览">
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
